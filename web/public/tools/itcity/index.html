<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IT CITY · Order Matrix</title><link rel="stylesheet" href="styles.css"><script defer src="xlsx.full.min.js"></script><script defer src="../shared/pdf-to-rows.js"></script><script defer src="it-city-core.js"></script><script defer src="data.js"></script><script defer src="app.js"></script></head>
<body>
<a href="/" style="display:inline-block;padding:10px 22px 0;color:#64748b;text-decoration:none;font-size:13px;font-weight:600">&lsaquo; กลับหน้าหลัก</a>
<header class="app-header"><img src="logo.jpeg" alt="Gadget Villa"><div><h1>IT CITY</h1><span>Order Matrix · ใบสรุปส่งของ</span></div><span class="version">v1</span></header>
<div class="workspace">
<aside class="sidebar">
  <section><h2>ไฟล์ออเดอร์</h2><input id="orderFiles" type="file" accept=".xlsx,.xlsm,.xls,.xlsb,.ods,.csv,.tsv,.pdf" multiple aria-label="เลือกไฟล์ออเดอร์ IT CITY"><div id="fileNames" class="file-names"></div><button id="sampleButton" class="secondary" type="button">เปิดไฟล์ตัวอย่าง</button></section>
  <section><h2>ข้อมูล SKU ระบบ</h2><button id="syncMaster" type="button">ซิงค์สดจากเว็บ Catalog</button><input id="masterFile" type="file" accept=".xlsx,.xlsm,.xls,.xlsb,.ods,.csv,.tsv,.pdf" aria-label="เลือกไฟล์ SKU ระบบ"><p id="masterName" class="muted"></p><button id="resetMaster" class="secondary" type="button">ใช้ฐานระบบที่แนบมา</button></section>
  <section><h2>สาขาที่แสดง</h2><label class="field">ประเภทการส่ง<select id="kindSelect" aria-label="ประเภทการส่ง"><option value="">ทุกประเภท</option></select></label><label class="field">สาขา</label><select id="branchSelect" aria-label="เลือกสาขา"><option value="">ทุกสาขา</option></select><label class="field">ค้นหาใน Matrix / ตารางตรวจบาร์<input id="search" type="search" placeholder="รหัส / รุ่น / บาร์โค้ด"></label><label class="field">สถานะในตาราง<select id="statusSelect"><option value="">ทั้งหมด</option><option value="match">ตรงกัน</option><option value="relabel">ต้องเปลี่ยนบาร์โค้ด</option><option value="review">ต้องตรวจสอบ</option><option value="unchecked">ไม่มีบาร์ลูกค้า</option></select></label></section>
  <section><h2>พิมพ์ใบส่งของ</h2><label class="check"><input id="includeTrb" type="checkbox" checked>เลข PO / TRB</label><label class="check"><input id="includeChecks" type="checkbox">คำเตือนบาร์โค้ด</label><label class="field">จำนวนใบต่อสาขา<input id="copies" type="number" min="1" max="20" step="1" value="3" aria-label="จำนวนใบส่งของต่อสาขา"></label><button id="printButton" type="button">พิมพ์สาขาที่เลือก</button><p class="muted">ขอบเขตพิมพ์: <span id="printScope"></span></p></section>
  <button id="exportButton" class="secondary" type="button">ดาวน์โหลด Excel ทั้งหมด</button><button id="packJobButton" class="secondary" type="button">สร้างงานยิงสแกน</button>
</aside>
<main class="main">
  <div id="error" class="alert error" role="alert" hidden></div><div id="loading" class="alert" role="status" hidden>กำลังอ่านไฟล์…</div>
  <div id="warnings" class="alerts"></div>
  <div class="stats"><div><span>สาขา</span><strong id="branchCount">0</strong></div><div><span>รายการรายสาขา</span><strong id="lineCount">0</strong></div><div><span>จำนวนชิ้น</span><strong id="qtyCount">0</strong></div><div><span>เปลี่ยนบาร์ / ตรวจสอบ</span><strong id="issueCount">0</strong></div></div>
  <nav class="tabs" aria-label="มุมมอง"><button type="button" data-view="delivery" aria-pressed="true">ใบส่งของ</button><button type="button" data-view="matrix" aria-pressed="false">Order Matrix</button><button type="button" data-view="checks" aria-pressed="false">ตรวจ SKU / บาร์โค้ด</button></nav>
  <section id="deliveryView"><div class="view-heading"><h2>ใบสรุปส่งของรายสาขา</h2><span id="pageCount"></span></div><div id="deliveryPages"></div></section>
  <section id="matrixView" hidden><div class="view-heading"><h2>Order Matrix</h2><span id="matrixCount"></span></div><div class="table-scroll"><table id="matrixTable"></table></div></section>
  <section id="checksView" hidden><div class="view-heading"><h2>เทียบ SKU และบาร์โค้ด</h2><span id="checkCount"></span></div><div class="table-scroll"><table id="checkTable"></table></div></section>
</main></div>
<div id="printPages" aria-hidden="true"></div>
</body></html>
